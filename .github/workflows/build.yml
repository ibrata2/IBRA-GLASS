name: Build IBRA GLASS

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

env:
  ENGINE_VERSION: '2.1.0'

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Tests
        run: npm test

      - name: Fetch ExplorerBlurMica engine (official, unmodified)
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: ./scripts/fetch-engine.ps1 -Version $env:ENGINE_VERSION

      - name: Build installer
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: npx electron-builder --win nsis --x64 --publish never

      - name: Verify engine is inside the app
        shell: pwsh
        run: |
          $e = "dist/win-unpacked/resources/engine"
          foreach ($f in @("ExplorerBlurMica.dll","ENGINE_VERSION.txt","ENGINE-LICENSE.txt","ENGINE-COPYING.LESSER.txt")) {
            if (-not (Test-Path "$e/$f")) { throw "missing $e/$f" }
          }
          Get-Content "$e/ENGINE_VERSION.txt"
          Get-ChildItem dist/*.exe | Format-Table Name, Length

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: IBRA-GLASS-Setup
          path: dist/*.exe

      - name: Read app version
        id: ver
        shell: pwsh
        run: |
          $v = (Get-Content package.json -Raw | ConvertFrom-Json).version
          "tag=v$v" >> $env:GITHUB_OUTPUT

      # Every push to main publishes/updates the Release for the version in package.json
      # (bump "version" to make a new Release). Tag pushes work too.
      - name: Publish GitHub Release
        if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || steps.ver.outputs.tag }}
          target_commitish: ${{ github.sha }}
          name: IBRA GLASS ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || steps.ver.outputs.tag }}
          make_latest: true
          files: dist/*.exe
          body: |
            ## IBRA GLASS ${{ steps.ver.outputs.tag }}
            زجاج لمستكشف ملفات ويندوز — Blur / Acrylic / Mica، أكثر من 40 ستايل جاهز، محرّر ألوان ومعاينة مباشرة.

            **التنصيب:** نزّل `IBRA-GLASS-Setup-*.exe` وشغّله، بعدها افتح البرنامج، اختار ستايل، واضغط **ثبّت وطبّق**.

            المحرك: ExplorerBlurMica ${{ env.ENGINE_VERSION }} من تطوير Maplespe (LGPL-3.0) مضمّن بدون تعديل.
            تصميم وتطوير إبراهيم الخزرجي — t.me/ibraprogram
