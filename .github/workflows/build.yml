name: Build IBRA GLASS

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

env:
  ENGINE_VERSION: '2.1.0'

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Tests
        run: npm test

      - name: Fetch ExplorerBlurMica engine (official, unmodified)
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: ./scripts/fetch-engine.ps1 -Version $env:ENGINE_VERSION

      - name: Build installer
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: npx electron-builder --win nsis --x64 --publish never

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: IBRA-GLASS-Setup
          path: dist/*.exe

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          name: IBRA GLASS ${{ github.ref_name }}
          files: dist/*.exe
          body: |
            ## IBRA GLASS ${{ github.ref_name }}
            زجاج لمستكشف ملفات ويندوز — Blur / Acrylic / Mica، أكثر من 40 ستايل جاهز، محرّر ألوان ومعاينة مباشرة.

            **التنصيب:** نزّل `IBRA-GLASS-Setup-*.exe` وشغّله، بعدها افتح البرنامج، اختار ستايل، واضغط **ثبّت وطبّق**.

            المحرك: ExplorerBlurMica ${{ env.ENGINE_VERSION }} من تطوير Maplespe (LGPL-3.0) مضمّن بدون تعديل.
            تصميم وتطوير إبراهيم الخزرجي — t.me/ibraprogram
