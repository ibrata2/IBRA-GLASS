<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1c1a22"/>
      <stop offset="0.55" stop-color="#0a0a0e"/>
      <stop offset="1" stop-color="#050507"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fff1b8"/>
      <stop offset="0.35" stop-color="#e9c860"/>
      <stop offset="0.7" stop-color="#c9a84c"/>
      <stop offset="1" stop-color="#7a5c18"/>
    </linearGradient>
    <linearGradient id="paneBack" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#d4af37" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#6b4f12" stop-opacity="0.35"/>
    </linearGradient>
    <linearGradient id="paneFront" x1="0" y1="0" x2="0.3" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.42"/>
      <stop offset="0.5" stop-color="#ffffff" stop-opacity="0.16"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0.06"/>
    </linearGradient>
    <linearGradient id="prism" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#7fd6ff" stop-opacity="0"/>
      <stop offset="0.3" stop-color="#7fd6ff" stop-opacity="0.55"/>
      <stop offset="0.55" stop-color="#c99bff" stop-opacity="0.5"/>
      <stop offset="0.8" stop-color="#ffd27a" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#ffd27a" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.55" r="0.5">
      <stop offset="0" stop-color="#d4af37" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#d4af37" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="shine" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="18"/>
    </filter>
    <clipPath id="tile"><rect x="40" y="40" width="944" height="944" rx="210"/></clipPath>
  </defs>

  <!-- tile -->
  <rect x="40" y="40" width="944" height="944" rx="210" fill="url(#bg)"/>
  <g clip-path="url(#tile)">
    <circle cx="512" cy="560" r="420" fill="url(#glow)"/>
    <!-- blurred light blobs behind the glass -->
    <circle cx="360" cy="430" r="120" fill="#d4af37" opacity="0.55" filter="url(#soft)"/>
    <circle cx="660" cy="640" r="140" fill="#9a6cff" opacity="0.35" filter="url(#soft)"/>
    <circle cx="700" cy="360" r="90" fill="#4fc3ff" opacity="0.3" filter="url(#soft)"/>
    <rect x="40" y="40" width="944" height="420" fill="url(#shine)"/>
  </g>
  <rect x="44" y="44" width="936" height="936" rx="206" fill="none" stroke="url(#gold)" stroke-width="8" opacity="0.85"/>

  <!-- back pane (folder back with tab) -->
  <path d="M232 330 q0-36 36-36 h170 q22 0 36 18 l34 42 h248 q36 0 36 36 v300 q0 36-36 36 H268 q-36 0-36-36 Z"
        fill="url(#paneBack)" stroke="url(#gold)" stroke-width="10" stroke-linejoin="round"/>

  <!-- front frosted pane -->
  <path d="M200 452 q0-34 34-34 h556 q34 0 34 34 l-22 274 q-3 34-37 34 H259 q-34 0-37-34 Z"
        fill="url(#paneFront)" stroke="url(#gold)" stroke-width="12" stroke-linejoin="round"/>
  <!-- frost texture lines -->
  <path d="M250 470 h420" stroke="#ffffff" stroke-opacity="0.45" stroke-width="10" stroke-linecap="round"/>
  <path d="M250 500 h250" stroke="#ffffff" stroke-opacity="0.22" stroke-width="8" stroke-linecap="round"/>
  <!-- prismatic refraction band -->
  <path d="M215 620 C400 560, 620 700, 810 610" stroke="url(#prism)" stroke-width="26" fill="none" stroke-linecap="round"/>

  <!-- sparkle -->
  <path d="M760 210 l18 52 52 18 -52 18 -18 52 -18-52 -52-18 52-18z" fill="url(#gold)"/>
  <circle cx="842" cy="352" r="12" fill="#fff1b8"/>
</svg>
